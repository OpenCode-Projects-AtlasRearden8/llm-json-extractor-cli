[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-json-extractor"
version = "0.1.0"
description = "Turn messy prose into clean data: JSON schema in, validated JSONL out, from any OpenAI-compatible endpoint (local-first, no API keys)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Asdale Dynamics, LLC" }]
keywords = ["llm", "ollama", "json-schema", "extraction", "jsonl", "local-ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: General",
]
dependencies = ["jsonschema>=4.17"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://dylanasdale.github.io"

[project.scripts]
llm-json-extractor = "llm_json_extractor.cli:main"
lje = "llm_json_extractor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
